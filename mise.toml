# Tool versions for CI and local development. After cloning, run `mise install`.
#
# The bundle itself is built in Docker; see the Dockerfile and versions.env.
min_version = "2025.11.0"

[tools]
# Must equal GO_VERSION in the Dockerfile, which builds the launcher that ships
# in the bundle. .buildkite/steps/test-launcher checks this.
go = "1.27.1"

# Only the release step needs the GitHub CLI. The aqua registry entry for it
# fails attestation verification, so install it directly from GitHub instead.
"github:cli/cli" = "2.102.0"
